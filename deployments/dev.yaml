# Local development: the Kratos of `make it-up` (24433/24434), the overlay
# it loads, the local Backplane stack (`make run`).
kratos:
  admin_url: http://127.0.0.1:24434
  public_url: http://127.0.0.1:24433
callbacks:
  listen: ":8090"
  url: http://127.0.0.1:8090
overlay: /tmp/backplane-kratos-it/overlay.yml
settings:
  registration:
    ui_url: http://127.0.0.1:4455/registration
  login:
    ui_url: http://127.0.0.1:4455/login
  verification:
    enabled: true
  recovery:
    enabled: true

# TypeScript of the events' contract (proto/kratos/events), published as the
# npm package @backplane-labs/kratos-events (events/). Run through `make gen`.
lint:
  use:
    - DEFAULT
  service_suffix: Service
  allow_comment_ignores: false
  except:
    - PACKAGE_DIRECTORY_MATCH
generate:
  inputs:
    - directory:
        path: kratos/events
        root: proto
  plugins:
    - name: es
      out: events/src
      opts:
        target: ts
